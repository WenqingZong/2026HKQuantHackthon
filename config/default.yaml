  horizon: 5 # 标签：未来 5 个交易日收益（与调仓周期保持一致）
  label_lag: 1 # 因子用到当日收盘价，最早下一个交易日才能成交，标签相应后移 1 天
  label_norm: rank # 标签横截面标准化：rank / zscore / none。rank 等于把回归变成排序，与 top-k 选股一致
  normalize: rank # rank = 按日做横截面百分位标准化；zscore = 按日均值方差标准化
  # 预热期：不能短于任何一个因子的回看（最长的是 alpha019/039 的 sum(returns, 250)），否则 build_dataset 直接报错。
  # 按标的各自计算：晚上市的 ETF 也要攒够 250 根 K 线才进入数据集
  min_history: 250
  output: data/processed/features.parquet

split:
  # 行情 2018-05 起，250 天预热后样本从 2019-05 开始
  train: ["2019-05-01", "2022-12-31"]
  valid: ["2023-01-01", "2023-12-31"]
  test: ["2024-01-01", "2026-10-27"]

train:
  seed: 42
  models: [xgboost, lightgbm, mlp]
  early_stopping_rounds: 50
  artifacts: artifacts

models:
  # 下面的参数是 scripts/sweep_models.py 在验证集（2023 年）ICIR 上选出来的，限定在「全部 186 个因子」
  # 这一个因子集里（流水线一次只用一个因子集）；测试集只记录、不参与选择。各因子集的完整结果见
  # artifacts/sweep/。注意 LightGBM 的 subsample 要配 subsample_freq > 0 才生效，网格里没开，等于没有行采样。
  # n_jobs：WSL 上用满全部线程（-1）时 LightGBM 会慢 20 倍（线程争用），8 线程最快
  xgboost: # xgb_d7
    n_jobs: 8
    n_estimators: 2500
    learning_rate: 0.02
    max_depth: 7
    min_child_weight: 300
    subsample: 0.7
    colsample_bytree: 0.4
    reg_lambda: 5.0
  lightgbm: # lgb_l127
    n_jobs: 8
    n_estimators: 3000
    learning_rate: 0.015
    num_leaves: 127
    min_child_samples: 500
    subsample: 0.6
    colsample_bytree: 0.3
    reg_lambda: 10.0
  mlp: # mlp_64_slow。大网络（[2048, 1024, 512] 等）在第 1 个 epoch 验证集就最优，之后全是过拟合
    hidden: [64]
    dropout: 0.3
    lr: 0.0001
    weight_decay: 0.001
    batch_size: 4096
    max_epochs: 300
    patience: 30
    threads: 8

backtest:
  top_k: 10 # 每次调仓等权买入预测排名前 k 只
  rebalance_days: 5 # 每 5 个交易日调仓一次
  # 单边成本：账户佣金约 0.4–0.7bp，加上滑点先按 1.5bp 估。买卖两边分别收，
  # 所以每期成本 = 总成交名义金额 × cost_bps
  cost_bps: 1.5