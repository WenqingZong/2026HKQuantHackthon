  horizon: 5 # 标签：未来 5 个交易日收益（与调仓周期保持一致）
  label_lag: 1 # 因子用到当日收盘价，最早下一个交易日才能成交，标签相应后移 1 天
  label_norm: rank # 标签横截面标准化：rank / zscore / none。rank 等于把回归变成排序，与 top-k 选股一致
  normalize: rank # rank = 按日做横截面百分位标准化；zscore = 按日均值方差标准化
  min_history: 20 # 因子预热所需的交易日数，这段数据不参与训练
  output: data/processed/features.parquet

split:
  train: ["2023-05-01", "2025-06-30"]
  valid: ["2025-07-01", "2026-01-31"]
  test: ["2026-02-01", "2026-10-27"]

train:
  seed: 42
  models: [xgboost, lightgbm, mlp]
  early_stopping_rounds: 50
  artifacts: artifacts

models:
  # 下面的参数是 scripts/sweep_models.py 在验证集 ICIR 上选出来的（测试集只看不选）
  xgboost:
    n_estimators: 1500
    learning_rate: 0.03
    max_depth: 5
    min_child_weight: 100
    subsample: 0.8
    colsample_bytree: 0.6
    reg_lambda: 2.0
  lightgbm:
    n_estimators: 900
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.7
    colsample_bytree: 0.5
    reg_lambda: 3.0
  mlp:
    hidden: [2048, 1024, 512]
    dropout: 0.4
    lr: 0.0003
    weight_decay: 0.01
    batch_size: 4096
    max_epochs: 500
    patience: 50

backtest:
  top_k: 10 # 每次调仓等权买入预测排名前 k 只
  rebalance_days: 5 # 每 5 个交易日调仓一次
  # 单边成本：账户佣金约 0.4–0.7bp，加上滑点先按 1.5bp 估。买卖两边分别收，
  # 所以每期成本 = 总成交名义金额 × cost_bps
  cost_bps: 1.5