# 2026 HK Quant Hackathon —— 流水线配置
# 所有相对路径都以仓库根目录为基准。

universe:
  # 训练池：覆盖各投资方向、历史较长的 ETF
  training_tickers: selected_etfs/training_tickers.csv
  # 交易池：按流动性/规模/成本筛出、每个方向只留一只的 ETF
  trading_tickers: selected_etfs/trading_tickers.csv
  # 含成立日/换策略日期的完整表：多场所拼接时据此裁掉 ticker 被复用之前的行情（如 IBIT 2024-01 之前）
  training_universe: selected_etfs/training_universe.csv
  trading_universe: selected_etfs/trading_universe.csv

data:
  # 行情来源二选一：
  # 1) venues 非空：用各交易所自己的数据集拼日线（hkq/venues.py），2018-05 起，历史最长；
  #    开收盘取上市交易所的官方竞价价，最高最低取常规时段小时线，成交量为各交易所显性成交之和
  # 2) venues 为空：直接下载 dataset 指定的单个数据集。EQUS.SUMMARY 是官方合并日线但 2024-07 才开始，
  #    EQUS.MINI 2023-03 起、成交量只有部分场所（约 3–8%）
  venues: [ARCX.PILLAR, BATS.PITCH, EDGX.PITCH, XNAS.ITCH, XNYS.PILLAR]
  # 只有这几家是 ETF 的上市交易所，官方开收盘竞价价从它们的 statistics 里取
  auction_venues: [ARCX.PILLAR, XNAS.ITCH, BATS.PITCH]
  venue_dir: data/raw/venues # 各交易所原始文件；已存在的不会重新下载（不会重复扣费）
  dataset: EQUS.SUMMARY
  schema: ohlcv-1d
  start: "2018-05-01"
  end: null # null 表示取数据集可用的最后一个交易日
  output: data/raw/bars_daily.parquet
  # 分红/拆股记录（yfinance）。原始价必须复权后再算因子和回测。
  # 存的是 yfinance 原样的数值（分红被之后的拆股追溯调整过），load_actions 读入时换算回当时的实际派息
  corporate_actions: data/raw/venues/corporate_actions.parquet

