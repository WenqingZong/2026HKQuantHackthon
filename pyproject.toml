[project]
name = "2026hkquanthackthon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "databento>=0.88.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch",
    "xgboost>=3.4.1",
    "yfinance>=1.7.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ISC"]
# 中文注释里的全角标点是正常的，不用 RUF001/002/003 去挑刺
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 因子的 docstring 直接照抄论文公式，行超长是为了和原文一一对应
"hkq/alphas.py" = ["E501"]

[[tool.mypy.overrides]]
# yfinance 没有 py.typed，也没有第三方 stub
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.14"
files = ["hkq", "main.py", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true