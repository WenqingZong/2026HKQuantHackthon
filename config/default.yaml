# 2026 HK Quant Hackathon —— 流水线配置
# 所有相对路径都以仓库根目录为基准。

universe:
  # 训练池：覆盖各投资方向、历史较长的 ETF
  training_tickers: selected_etfs/training_tickers.csv
  # 交易池：按流动性/规模/成本筛出、每个方向只留一只的 ETF
  trading_tickers: selected_etfs/trading_tickers.csv

data:
  # EQUS.SUMMARY 是合并全市场成交后的官方日线汇总（每个代码每天一条记录），
  # 覆盖 2024-07-01 起。若需要更长的历史，可换成 EQUS.MINI / DBEQ.BASIC，
  # 代价是成交量只包含部分交易场所（见 README「数据选型」）。
  # EQUS.MINI 的价格是合并后的完整行情，2023-03-28 起；成交量只是部分场所的采样
  # （约为合并成交量的 3–8%，且比例随时间漂移），但比率类因子对整体缩放不敏感
  dataset: EQUS.MINI
  schema: ohlcv-1d
  start: "2023-03-28"
  end: null # null 表示取数据集可用的最后一个交易日
  output: data/raw/bars_daily.parquet
  # 分红/拆股记录（yfinance，download 阶段一起拉）。原始价必须复权后再算因子和回测
  corporate_actions: data/raw/corporate_actions.parquet

